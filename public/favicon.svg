<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00BAFF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BAFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BAFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00BAFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lockBg)" stroke="url(#glowBorder)" stroke-width="2.5"/>

  <!-- Shackle (Lock Top Arch) -->
  <path d="M22 28V19C22 13.477 26.477 9 32 9C37.523 9 42 13.477 42 19V28" stroke="url(#shackleGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="15" y="26" width="34" height="27" rx="8" fill="#0B132B" stroke="#00BAFF" stroke-width="2.5"/>

  <!-- Radar / SEO Target Radar Ring -->
  <circle cx="32" cy="39" r="9.5" fill="url(#radarPulse)"/>
  <circle cx="32" cy="39" r="8" stroke="#10B981" stroke-width="1.2" stroke-dasharray="2.5 3" opacity="0.9"/>

  <!-- Keyhole Search Core -->
  <circle cx="32" cy="37.5" r="3.5" fill="#00BAFF"/>
  <path d="M30 39.5L34 39.5L33.2 45.5L30.8 45.5Z" fill="#00BAFF"/>
  <circle cx="32" cy="37.5" r="1.3" fill="#FFFFFF"/>
</svg>